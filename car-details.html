<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تفاصيل السيارة وسعرها ومعلومات التواصل على SoukAutoDZ">
    <title>تفاصيل السيارة | SoukAutoDZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            line-height: 1.7;
        }

        header {
            background: #142b4a;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .car-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .main-image {
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            background: #e9edf2;
            display: block;
        }

        .car-info {
            padding: 22px;
        }

        h1 {
            margin-top: 0;
            font-size: 27px;
        }

        .price {
            color: #087f45;
            font-size: 25px;
            font-weight: bold;
            margin: 12px 0 20px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .detail {
            background: #f5f6f8;
            padding: 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .value {
            font-weight: bold;
        }

        .description {
            margin-top: 22px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .contact {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #087f45;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #142b4a;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .details {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 23px;
            }

            .car-info {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">SoukAutoDZ</a>
    <div>سوق السيارات في الجزائر</div>
</header>

<main class="container">
    <a class="back" href="index.html">→ العودة إلى الصفحة الرئيسية</a>

    <div id="carDetails" class="message" aria-live="polite">
        جارٍ تحميل تفاصيل السيارة...
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function showMessage(message) {
        const container = document.getElementById("carDetails");
        container.className = "message";
        container.textContent = message;
    }

    async function loadCarDetails() {
        const params = new URLSearchParams(window.location.search);
        const carId = params.get("id");

        if (!carId || !/^\d+$/.test(carId)) {
            showMessage("لم يتم تحديد سيارة صحيحة.");
            return;
        }

        const { data: car, error } = await db
            .from("cars")
            .select("*")
            .eq("id", carId)
            .eq("status", "approved")
            .maybeSingle();

        if (error) {
            console.error("خطأ في تحميل السيارة:", error);
            showMessage("تعذر تحميل تفاصيل السيارة. حاول مرة أخرى لاحقًا.");
            return;
        }

        if (!car) {
            showMessage("السيارة غير موجودة أو لم تتم الموافقة على إعلانها.");
            return;
        }

        const container = document.getElementById("carDetails");
        container.className = "car-card";

        const image = document.createElement("img");
        image.className = "main-image";
        image.alt = "صورة السيارة";

        if (Array.isArray(car.images) && car.images.length > 0) {
            image.src = car.images[0];
        } else {
            image.alt = "لا توجد صورة للسيارة";
            image.style.display = "none";
        }

        const info = document.createElement("div");
        info.className = "car-info";

        const title = document.createElement("h1");
        title.textContent = `${car.brand || ""} ${car.model || ""}`.trim()
            || "سيارة للبيع";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent =
            (Number(car.price) || 0).toLocaleString("fr-DZ") + " دج";

    const details = document.createElement("div");
details.className = "details";

    const fields = [
        ["الولاية", car.wilaya || "غير محددة"],
        ["البلدية", car.commune || "غير محددة"],
        ["سنة الصنع", car.year || "غير محددة"],
        ["نوع الوقود", car.fuel || "غير محدد"],
        ["المسافة المقطوعة", car.mileage != null
            ? Number(car.mileage).toLocaleString("fr-DZ") + " كم"
            : "غير محددة"],
        ["ناقل الحركة", car.transmission || "غير محدد"]
    ];

        fields.forEach(function(field) {
            const box = document.createElement("div");
            box.className = "detail";

            const label = document.createElement("div");
            label.className = "label";
            label.textContent = field[0];

            const value = document.createElement("div");
            value.className = "value";
            value.textContent = field[1];

            box.append(label, value);
            details.appendChild(box);
        });

        const description = document.createElement("div");
        description.className = "description";

        const descriptionTitle = document.createElement("h3");
        descriptionTitle.textContent = "وصف السيارة";

        const descriptionText = document.createElement("p");
        descriptionText.textContent =
            car.description || "لم يضف صاحب الإعلان وصفًا للسيارة.";

        description.append(descriptionTitle, descriptionText);

        info.append(title, price, details, description);

        if (car.phone) {
            const contact = document.createElement("a");
            contact.className = "contact";
            contact.textContent = "اتصل بصاحب الإعلان";
            contact.href = "tel:" + String(car.phone).replace(/[^\d+]/g, "");
            info.appendChild(contact);
        }

        container.replaceChildren(image, info);

        document.title = title.textContent + " | SoukAutoDZ";
    }

    loadCarDetails();
</script>

</body>
</html>
