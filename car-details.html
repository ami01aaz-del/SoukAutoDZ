<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تفاصيل السيارة وسعرها ومعلومات التواصل على SoukAutoDZ">
    <title>تفاصيل السيارة | SoukAutoDZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            line-height: 1.7;
        }

        header {
            background: #142b4a;
            color: white;
            padding: 18px 15px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .car-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .main-image {
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            background: #e9edf2;
            display: block;
        }

        .car-info {
            padding: 22px;
        }

        h1 {
            margin-top: 0;
            font-size: 27px;
        }

        .price {
            color: #087f45;
            font-size: 25px;
            font-weight: bold;
            margin: 12px 0 20px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .details {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.detail {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 14px 12px;
    background: #ffffff;
    border: 1px solid #e1eaf7;
    border-radius: 14px;
    overflow-wrap: anywhere;
}

.detail-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #eaf2ff;
    color: #0866df;
}

.detail-icon svg {
    width: 23px;
    height: 23px;
    display: block;
}

.label {
    color: #647da3;
    font-size: 13px;
    margin-bottom: 5px;
}

.value {
    color: #142b4a;
    font-size: 15px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.description {
    margin-top: 20px;
    padding: 18px;
    background: #ffffff;
    border: 1px solid #e1eaf7;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.contacts {
    margin-top: 20px;
    padding: 18px;
    background: #ffffff;
    border: 1px solid #e1eaf7;
    border-radius: 14px;
}

.contacts h3 {
    margin: 0 0 14px;
    color: #142b4a;
    font-size: 18px;
}

.contact-row {
    margin-top: 10px;
}

.contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
    padding: 15px 12px;
    border-radius: 12px;
    background: #0866df;
    color: #ffffff;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    direction: ltr;
}

.contact svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
}

.message {
    background: white;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
}

.back {
    display: inline-block;
    margin-bottom: 18px;
    color: #142b4a;
    text-decoration: none;
}

@media (max-width: 500px) {
    .details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .detail {
        gap: 8px;
        padding: 10px 8px;
    }

    .detail-icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
    }

    .detail-icon svg {
        width: 20px;
        height: 20px;
    }

    .label {
        font-size: 12px;
    }

    .value {
        font-size: 13px;
    }

    h1 {
        font-size: 23px;
    }

    .car-info {
        padding: 16px;
    }
}
    </style>
</head>

<body>

<header>
    <a href="index.html">SoukAutoDZ</a>
    <div>سوق السيارات في الجزائر</div>
</header>

<main class="container">
    <a class="back" href="index.html">→ العودة إلى الصفحة الرئيسية</a>

    <div id="carDetails" class="message" aria-live="polite">
        جارٍ تحميل تفاصيل السيارة...
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    function showMessage(message) {
        const container = document.getElementById("carDetails");
        container.className = "message";
        container.textContent = message;
    }

    async function loadCarDetails() {
        const params = new URLSearchParams(window.location.search);
        const carId = params.get("id");

        if (!carId || !/^\d+$/.test(carId)) {
            showMessage("لم يتم تحديد سيارة صحيحة.");
            return;
        }

        const { data: car, error } = await db
            .from("cars")
            .select("*")
            .eq("id", carId)
            .eq("status", "approved")
            .maybeSingle();

        if (error) {
            console.error("خطأ في تحميل السيارة:", error);
            showMessage("تعذر تحميل تفاصيل السيارة. حاول مرة أخرى لاحقًا.");
            return;
        }

        if (!car) {
            showMessage("السيارة غير موجودة أو لم تتم الموافقة على إعلانها.");
            return;
        }

        const container = document.getElementById("carDetails");
        container.className = "car-card";

        const image = document.createElement("img");
        image.className = "main-image";
        image.alt = "صورة السيارة";

        if (Array.isArray(car.images) && car.images.length > 0) {
            image.src = car.images[0];
        } else {
            image.alt = "لا توجد صورة للسيارة";
            image.style.display = "none";
        }

        const info = document.createElement("div");
        info.className = "car-info";

        const title = document.createElement("h1");
        title.textContent = `${car.brand || ""} ${car.model || ""}`.trim()
            || "سيارة للبيع";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent =
            (Number(car.price) || 0).toLocaleString("fr-DZ") + " دج";

        const details = document.createElement("div");
        details.className = "details";

  const fields = [
    {
        label: "الولاية",
        value: car.wilaya || "غير محددة",
        icon: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>'
    },
    {
        label: "سنة الصنع",
        value: car.year || "غير محددة",
        icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>'
    },
    {
        label: "نوع الوقود",
        value: car.fuel || "غير محدد",
        icon: '<path d="M6 3h9v18H6z"/><path d="M15 7h3l2 3v7h-5"/><path d="M9 7h3M9 11h3"/>'
    },
    {
        label: "المسافة المقطوعة",
        value: car.mileage != null
            ? Number(car.mileage).toLocaleString("fr-DZ") + " كم"
            : "غير محددة",
        icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>'
    },
    {
        label: "ناقل الحركة",
        value: car.transmission || "غير محدد",
        icon: '<path d="M6 5v14M12 5v14M18 5v14M6 8h12M6 16h12"/><circle cx="6" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="18" cy="5" r="2"/>'
    }
];

fields.forEach(function(field) {
    const box = document.createElement("div");
    box.className = "detail";

    const iconBox = document.createElement("div");
    iconBox.className = "detail-icon";

    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.8");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");

    svg.innerHTML = field.icon;
    iconBox.appendChild(svg);

    const textBox = document.createElement("div");
    textBox.style.minWidth = "0";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = field.label;

    const value = document.createElement("div");
    value.className = "value";
    value.textContent = field.value;

    textBox.append(label, value);
    box.append(iconBox, textBox);
    details.appendChild(box);
});

        const description = document.createElement("div");
        description.className = "description";

        const descriptionTitle = document.createElement("h3");
        descriptionTitle.textContent = "وصف السيارة";

        const descriptionText = document.createElement("p");
        descriptionText.textContent =
            car.description || "لم يضف صاحب الإعلان وصفًا للسيارة.";

        description.append(descriptionTitle, descriptionText);

        info.append(title, price, details, description);

        const contacts = document.createElement("div");
contacts.className = "contacts";

const contactsTitle = document.createElement("h3");
contactsTitle.textContent = "📞 الاتصال بصاحب الإعلان";
contacts.appendChild(contactsTitle);

const phoneNumbers = String(car.phone || "")
.split(/[,;\n/]+/)
.map(function(phone) {
return phone.trim();
})
.filter(function(phone) {
return phone.length > 0;
})
.slice(0, 3);

phoneNumbers.forEach(function(phone, index) {
const row = document.createElement("div");
row.className = "contact-row";

const number = document.createElement("span");
number.className = "contact-number";
number.textContent = phone;

const button = document.createElement("a");
button.className = "contact";
button.innerHTML = `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
        19.79 19.79 0 0 1-8.63-3.07
        19.5 19.5 0 0 1-6-6
        19.79 19.79 0 0 1-3.07-8.67
        A2 2 0 0 1 4.11 2h3
        a2 2 0 0 1 2 1.72
        c.12.96.36 1.9.7 2.79
        a2 2 0 0 1-.45 2.11L8.09 9.91
        a16 16 0 0 0 6 6l1.27-1.27
        a2 2 0 0 1 2.11-.45
        c.89.34 1.83.58 2.79.7
        A2 2 0 0 1 22 16.92z"/>
    </svg>
    <span>${phone}</span>
`;
button.href = "tel:" + phone.replace(/[^\d+]/g, "");

row.append(number, button);
contacts.appendChild(row);

});

if (phoneNumbers.length > 0) {
info.insertBefore(contacts, description);
}

        container.replaceChildren(image, info);

        document.title = title.textContent + " | SoukAutoDZ";
    }

    loadCarDetails();
</script>

</body>
</html>
