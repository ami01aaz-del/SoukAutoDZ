<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المشرف | SoukAutoDZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            font-size: 25px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            direction: ltr;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>SoukAutoDZ</h1>

        <p class="subtitle">
            تسجيل دخول المشرف<br>
            إدارة إعلانات السيارات
        </p>

        <form id="loginForm">
            <label for="email">البريد الإلكتروني</label>
            <input
                type="email"
                id="email"
                autocomplete="username"
                required
            >

            <label for="password">كلمة المرور</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                تسجيل الدخول
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="index.html" class="back-link">
            العودة إلى الصفحة الرئيسية
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "جارٍ التحقق...";
            message.textContent = "";

            try {
                const { data, error } = await db.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                const { data: isAdmin, error: adminError } =
                    await db.rpc("is_admin");

                if (adminError) {
                    await db.auth.signOut();
                    throw adminError;
                }

                if (isAdmin !== true) {
                    await db.auth.signOut();
                    throw new Error("هذا الحساب ليس لديه صلاحيات المشرف.");
                }

                message.textContent = "تم التحقق بنجاح. جارٍ فتح لوحة الإدارة...";
                window.location.href = "admin.html";

            } catch (error) {
                message.textContent =
                    error.message === "Invalid login credentials"
                    ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                    : error.message === "Invalid login credentials."
                    ? "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                    : error.message || "حدث خطأ. حاول مرة أخرى.";

                loginButton.disabled = false;
                loginButton.textContent = "تسجيل الدخول";
            }
        });
    </script>

</body>
</html>
